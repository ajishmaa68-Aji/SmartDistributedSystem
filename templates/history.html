<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment History</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>Assignment History</h1>
        <p>View Your Submitted Assignments</p>
    </header>

    <main class="container">
        <div class="card">
            <h3>Submission Records</h3>

            <table>
                <tr>
                    <th>ID</th>
                    <th>File Name</th>
                    <th>Status</th>
                </tr>

                {% for assignment in assignments %}
                <tr>
                    <td>{{ assignment[0] }}</td>
                    <td>{{ assignment[1] }}</td>
                    <td>{{ assignment[2] }}</td>
                </tr>
                {% endfor %}
            </table>

            <br>
           <a href="http://127.0.0.1:5000/">
    <button>Back to Dashboard</button>
</a>
        </div>
    </main>

</body>
</html>
